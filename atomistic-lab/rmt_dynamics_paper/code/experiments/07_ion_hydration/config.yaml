# Experiment 7 (pilot) — hydration cages around Li+, Na+, K+ and Cl-.
# TIP4P-Ew water with Joung-Cheatham ions (both from OpenMM amber14/tip4pew.xml),
# 432 waters + 4 ion pairs (~0.5 mol/kg), NPT 300 K, 1 atm.

template: water_ions_tip4pew.in.j2

fixed:
  n_water: 432
  n_pairs: 4
  initial_density: 1.0
  temperature: 300.0
  pressure: 1.0
  cutoff: 10.0
  timestep: 2.0
  premelt_T: 400.0
  premelt_steps: 25000          # 50 ps
  n_equil: 250000               # 0.5 ns
  n_prod: 5000000               # 10 ns
  sample_every: 100             # 0.2 ps
  analysis:
    lags_fs: [1000, 2000, 5000, 10000, 20000, 40000]
    origin_stride: 5            # 1 ps between window origins
    n_water_centres: 32         # pure-water control: oxygens used as centres

sweep:
  salt: [none, LiCl, NaCl, KCl]
  seed: [1, 2, 3]
