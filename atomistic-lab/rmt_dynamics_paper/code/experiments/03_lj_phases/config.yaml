# Experiment 3 — Lennard-Jones phases (argon, NPT isobar at P = 20 atm).
# See experiments.md §3.
#
# Why 20 atm: at 1 atm argon-parameter LJ is liquid only between the triple
# point (~84 K) and the boiling point (~87 K), so an isobar there has no
# usable liquid range. 20 atm is still below the critical pressure (~48 atm),
# so the isobar crosses both first-order lines, with the liquid stable from
# roughly 80 K to roughly 120 K for this truncation of the potential.
#
# Why three initial conditions: a 500-atom periodic box superheats and
# supercools, so a single branch places each transition at its limit of
# metastability, not at coexistence. Heating a crystal (fcc), starting from a
# dense disordered state (dense) and starting from a dilute gas (dilute)
# bracket each transition from both sides.

template: lj_nvt.in.j2

fixed:
  mass: 39.948
  sigma: 3.405
  epsilon: 0.2381
  cutoff: 10.215              # 3 sigma, plain truncation
  n_cells: 5                  # fcc cells per edge -> 4 * 5^3 = 500 atoms
  n_atoms: 500
  init_density_reduced:       # starting density, rho * sigma^3; NPT relaxes it
    fcc: 1.0
    dense: 0.8
    dilute: 0.02
  ensemble: npt
  pressure: 20.0              # atm
  timestep: 2.0
  n_equil: 150000             # 300 ps
  n_prod: 500000              # 1 ns
  sample_every: 10
  analysis:
    t_max_fs: 2000.0
    remove_mean: true

# 10 K steps in the solid and the gas, 5 K steps from 60 K to 140 K where
# both transitions and their metastable limits are expected.
sweep:
  init: [fcc, dense, dilute]
  temperature: [20.0, 30.0, 40.0, 50.0, 60.0, 65.0, 70.0, 75.0, 80.0, 85.0,
                90.0, 95.0, 100.0, 105.0, 110.0, 115.0, 120.0, 125.0, 130.0,
                135.0, 140.0, 150.0, 160.0]
  seed: [1, 2, 3]
